<section class="instrument-panel" aria-label="Tabla controls">
  <div class="instrument-control-block">
    <div class="instrument-control-head">
      <label for="tabla-taal">Taal</label>
    </div>
    <select id="tabla-taal" class="instrument-select" aria-label="Select taal">
      <option value="">Loading taals...</option>
    </select>
  </div>

  <div class="instrument-control-block">
    <div class="instrument-control-head">
      <label for="tabla-bpm">Speed (beats/min)</label>
    </div>
    <input id="tabla-bpm" class="instrument-slider instrument-slider-bpm" type="range" min="30" max="240" value="60" />
  </div>

  <div class="instrument-control-block">
    <div class="bpm-stepper" aria-label="BPM fine controls">
      <button type="button" data-bpm-action="-1">-1</button>
      <button type="button" data-bpm-action="-5">-5</button>
      <button type="button" data-bpm-action="/2">/2</button>
      <div class="bpm-stepper-readout">
        <input id="tabla-bpm-input" class="bpm-stepper-input" type="number" min="30" max="240" step="1" value="60" inputmode="numeric" />
        <span>bpm</span>
      </div>
      <button type="button" data-bpm-action="x2">x2</button>
      <button type="button" data-bpm-action="+5">+5</button>
      <button type="button" data-bpm-action="+1">+1</button>
    </div>
  </div>

  <div class="instrument-control-block">
    <div class="instrument-control-head">
      <label for="tabla-volume">Volume</label>
      <span id="tabla-volume-value">100</span>
    </div>
    <input id="tabla-volume" class="instrument-slider" type="range" min="0" max="100" value="100" />
  </div>
</section>
